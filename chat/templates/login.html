{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <div class="mx-auto flex min-h-screen max-w-md items-center justify-center px-4 py-10">
    <div class="w-full rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-6 shadow-sm">
      <div class="mb-6 flex items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold">Welcome back</h1>
          <p class="mt-1 text-sm text-muted-foreground">Sign in to continue exploring mythology.</p>
        </div>
      </div>

      {% if message %}
        <div class="mb-4 rounded-xl border border-red-500/30 bg-red-500/10 px-3 py-2 text-sm text-red-600">
          {{ message }}
        </div>
      {% endif %}

      <form action="{% url 'login' %}" method="post" class="flex flex-col gap-3">
        {% csrf_token %}

        <input
          type="text"
          name="username"
          placeholder="Username"
          required
          class="theme-input w-full rounded-xl border border-[var(--border)] bg-transparent px-4 py-3 outline-none"
        >

        <input
          type="password"
          name="password"
          placeholder="Password"
          required
          class="theme-input w-full rounded-xl border border-[var(--border)] bg-transparent px-4 py-3 outline-none"
        >

        <button type="submit" class="primary-button rounded-xl px-5 py-3 font-semibold transition">
          Log in
        </button>
      </form>

      <p class="mt-4 text-sm text-muted-foreground">
        Don’t have an account?
        <a class="font-medium text-[var(--accent)]" href="{% url 'register' %}">Create one</a>
      </p>
    </div>
  </div>
{% endblock %}
{% block ask_form %}{% endblock %}
