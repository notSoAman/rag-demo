{% block content %}
    <!--requested question and answer-->
    <div class="surface-card mb-6 rounded-2xl p-5 md:p-6">
        <h2 class="section-label text-lg font-semibold">Question:</h2>
        <p id="question" class="theme-text mb-4">{{ question }}</p>
        <h2 class="section-label text-lg font-semibold">Answer:</h2>
        <p id="answer" class="theme-text">{{ answer|safe }}</p>
    </div>
{% endblock %}
