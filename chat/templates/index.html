<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG DEMO</title>
    <!--tailwindcss-->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--htmx-->
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
    <!--alpinejs-->
    <script defer src="https://unpkg.com/alpinejs"></script>
  </head>

  <body>

    <div class="container mx-auto p-4">

      <div id="response">
         <!-- This placeholder will be filled by child templates -->
        {% block content %}
        {% endblock %}
      </div>
      <div class="mx-auto p-6"></div>











    <!--prompting box always visible at the bottom of screen-->
    <form 
        hx-post="/ask/"
        hx-target="#response"
        hx-swap="beforeend"
        hx-on:htmx:after-request="this.reset()"
        x-data="{ loading: false }"
        @htmx:before-request.window="loading = true"
        @htmx:after-request.window="loading = false"
        >
        {% csrf_token %}
    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t border-gray-300 flex items-center space-x-2">
      <input
        autofocus
        type="text"
        id="prompt"
        name="prompt"
        placeholder="Enter your prompt here"
        class="w-full p-2 border border-gray-300 rounded-md"
        :disabled="loading"
      />
      <button id="submit" class="bg-blue-500 text-white p-2 rounded-md" type="submit" :disabled="loading">
        <span x-text="loading ? 'Wait...' : 'Submit'"></span>
      </button>
    </div>
    </form>

    <!--auto scoll down-->
    <script>
    document.body.addEventListener("htmx:afterSwap", function (event) {
            if (event.detail.target.id === "response") {
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: "smooth"
                });
            }
        });
    </script>

    
  </body>
</html>
